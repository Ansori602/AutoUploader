name: Build Mac App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pillow requests psutil playwright pyinstaller

    - name: Build App
      run: |
        pyinstaller --clean --windowed --onedir app.py

    - name: Build Kompresor
      run: |
        pyinstaller --clean --noconsole --onedir kompresor.py

    - name: Build Uploader
      run: |
        pyinstaller --clean --noconsole --onedir uploader.py

    - name: Build Login
      run: |
        pyinstaller --clean --noconsole --onedir login.py

    - name: Build Watcher
      run: |
        pyinstaller --clean --noconsole --onedir watcher.py

    - name: Upload Mac Build
      uses: actions/upload-artifact@v4
      with:
        name: Fotoyu-Uploader-Mac
        path: dist/